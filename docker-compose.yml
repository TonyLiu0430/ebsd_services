services:
  py_backend:
    build:
      context: .
      dockerfile: py_backend/Dockerfile
      network: host # uv 下載 Python wheels 時避免 Docker build DNS 抖動
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cpp_backend:
    build:
      context: ./cpp_backend
      network: host # vcpkg 會出事 DO NOT EDIT!
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - cpp_backend
      - py_backend

  postgres:
    image: postgres:15-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL:-}
    depends_on:
      - caddy
    profiles: ["tunnel"]

  avahi:
    build:
      context: ./avahi
    network_mode: host
    environment:
      MDNS_HOSTNAME: ${MDNS_HOSTNAME:-ebsd}
      MDNS_INTERFACE: ${MDNS_INTERFACE:-}
    profiles: ["mdns"]
    restart: unless-stopped

volumes:
  pgdata:
